<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F8F9FA"/>
  
  <!-- Main dashboard mockup -->
  <g transform="translate(80, 50)">
    <!-- Shadow -->
    <rect x="12" y="12" width="620" height="490" rx="12" fill="#2C3E50" opacity="0.15"/>
    
    <!-- Main window -->
    <rect width="620" height="490" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect width="620" height="44" rx="12" fill="#0D6E6E"/>
    <rect y="36" width="620" height="8" fill="#0D6E6E"/>
    <circle cx="24" cy="22" r="6" fill="#EF4444"/>
    <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="22" r="6" fill="#10B981"/>
    <text x="310" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">PM Optimisation Analysis</text>
    
    <!-- Before/After comparison -->
    <g transform="translate(20, 60)">
      <text x="0" y="20" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#2C3E50">PM Task Review Summary</text>
      
      <!-- Stats cards -->
      <g transform="translate(0, 40)">
        <rect width="140" height="90" rx="8" fill="#EF4444" opacity="0.1" stroke="#EF4444" stroke-width="1"/>
        <text x="70" y="25" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Current Tasks</text>
        <text x="70" y="55" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#EF4444" text-anchor="middle">247</text>
        <text x="70" y="75" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">PM tasks</text>
      </g>
      
      <g transform="translate(160, 40)">
        <rect width="140" height="90" rx="8" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="1"/>
        <text x="70" y="25" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Optimised Tasks</text>
        <text x="70" y="55" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#10B981" text-anchor="middle">168</text>
        <text x="70" y="75" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">PM tasks</text>
      </g>
      
      <g transform="translate(320, 40)">
        <rect width="140" height="90" rx="8" fill="#0D6E6E" opacity="0.1" stroke="#0D6E6E" stroke-width="1"/>
        <text x="70" y="25" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Reduction</text>
        <text x="70" y="55" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#0D6E6E" text-anchor="middle">32%</text>
        <text x="70" y="75" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">fewer tasks</text>
      </g>
      
      <g transform="translate(480, 40)">
        <rect width="100" height="90" rx="8" fill="#E67E22" opacity="0.1" stroke="#E67E22" stroke-width="1"/>
        <text x="50" y="25" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Savings</text>
        <text x="50" y="55" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#E67E22" text-anchor="middle">£84K</text>
        <text x="50" y="75" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">/year</text>
      </g>
    </g>
    
    <!-- Task classification breakdown -->
    <g transform="translate(20, 210)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#2C3E50">Task Classification</text>
      
      <g transform="translate(0, 20)">
        <rect width="280" height="30" rx="4" fill="#10B981"/>
        <text x="10" y="20" font-family="Inter, sans-serif" font-size="11" fill="white">Keep - Value Adding (112)</text>
      </g>
      
      <g transform="translate(0, 55)">
        <rect width="140" height="30" rx="4" fill="#F59E0B"/>
        <text x="10" y="20" font-family="Inter, sans-serif" font-size="11" fill="white">Modify Interval (56)</text>
      </g>
      
      <g transform="translate(0, 90)">
        <rect width="100" height="30" rx="4" fill="#EF4444"/>
        <text x="10" y="20" font-family="Inter, sans-serif" font-size="11" fill="white">Eliminate (47)</text>
      </g>
      
      <g transform="translate(0, 125)">
        <rect width="80" height="30" rx="4" fill="#6B7280"/>
        <text x="10" y="20" font-family="Inter, sans-serif" font-size="11" fill="white">Review (32)</text>
      </g>
    </g>
    
    <!-- Pie chart placeholder -->
    <g transform="translate(380, 210)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#2C3E50">By Equipment Type</text>
      
      <g transform="translate(50, 30)">
        <!-- Pie segments -->
        <circle cx="70" cy="70" r="60" fill="#E5E7EB"/>
        <path d="M70 70 L70 10 A60 60 0 0 1 130 70 Z" fill="#0D6E6E"/>
        <path d="M70 70 L130 70 A60 60 0 0 1 70 130 Z" fill="#E67E22"/>
        <path d="M70 70 L70 130 A60 60 0 0 1 10 70 Z" fill="#2C3E50"/>
        <path d="M70 70 L10 70 A60 60 0 0 1 70 10 Z" fill="#F59E0B"/>
        
        <!-- Center circle -->
        <circle cx="70" cy="70" r="35" fill="white"/>
        <text x="70" y="75" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2C3E50" text-anchor="middle">247</text>
      </g>
    </g>
    
    <!-- Bottom action bar -->
    <g transform="translate(20, 420)">
      <rect x="0" y="0" width="580" height="50" rx="8" fill="#0D6E6E" opacity="0.05"/>
      <rect x="16" y="12" width="100" height="26" rx="4" fill="#0D6E6E"/>
      <text x="66" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">Export PDF</text>
      <rect x="130" y="12" width="100" height="26" rx="4" fill="white" stroke="#0D6E6E" stroke-width="1"/>
      <text x="180" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0D6E6E" text-anchor="middle">Export Excel</text>
    </g>
  </g>
  
  <!-- Decorative -->
  <circle cx="720" cy="100" r="50" fill="#10B981" opacity="0.1"/>
  <circle cx="70" cy="500" r="35" fill="#E67E22" opacity="0.08"/>
</svg>
