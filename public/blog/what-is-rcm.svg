<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0D6E6E"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Central gear with RCM -->
  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="100" fill="#2C3E50" fill-opacity="0.5" stroke="white" stroke-width="3"/>
    <circle cx="0" cy="0" r="60" fill="#E67E22"/>
    <text x="0" y="10" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="bold">RCM</text>
    
    <!-- Gear teeth -->
    <rect x="-15" y="-130" width="30" height="35" fill="white"/>
    <rect x="-15" y="95" width="30" height="35" fill="white"/>
    <rect x="-130" y="-15" width="35" height="30" fill="white"/>
    <rect x="95" y="-15" width="35" height="30" fill="white"/>
    
    <!-- Diagonal teeth -->
    <rect x="60" y="-100" width="30" height="30" fill="white" transform="rotate(45 75 -85)"/>
    <rect x="-90" y="-100" width="30" height="30" fill="white" transform="rotate(-45 -75 -85)"/>
    <rect x="60" y="70" width="30" height="30" fill="white" transform="rotate(-45 75 85)"/>
    <rect x="-90" y="70" width="30" height="30" fill="white" transform="rotate(45 -75 85)"/>
  </g>
  
  <!-- Labels around the gear -->
  <text x="200" y="100" fill="white" font-family="Inter, sans-serif" font-size="14" opacity="0.8">Functions</text>
  <text x="550" y="100" fill="white" font-family="Inter, sans-serif" font-size="14" opacity="0.8">Failures</text>
  <text x="200" y="320" fill="white" font-family="Inter, sans-serif" font-size="14" opacity="0.8">Consequences</text>
  <text x="550" y="320" fill="white" font-family="Inter, sans-serif" font-size="14" opacity="0.8">Tasks</text>
  
  <!-- Title -->
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Reliability Centred Maintenance</text>
</svg>
