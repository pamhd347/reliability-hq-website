<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#2C3E50"/>
  
  <!-- Code/prompt window -->
  <g transform="translate(100, 50)">
    <!-- Window chrome -->
    <rect x="0" y="0" width="600" height="300" rx="10" fill="#1a1a2e"/>
    <rect x="0" y="0" width="600" height="30" rx="10" fill="#16213e"/>
    <rect x="0" y="20" width="600" height="10" fill="#16213e"/>
    
    <!-- Window buttons -->
    <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="15" r="6" fill="#27ca40"/>
    
    <!-- Prompt text -->
    <text x="20" y="60" fill="#E67E22" font-family="monospace" font-size="12">// RCM Function Statement Prompt</text>
    <text x="20" y="85" fill="#98c379" font-family="monospace" font-size="12">"Generate RCM function statements for:</text>
    <text x="20" y="105" fill="#98c379" font-family="monospace" font-size="12"> Equipment: [EQUIPMENT_NAME]</text>
    <text x="20" y="125" fill="#98c379" font-family="monospace" font-size="12"> Type: [EQUIPMENT_TYPE]</text>
    <text x="20" y="145" fill="#98c379" font-family="monospace" font-size="12"> Context: [OPERATING_CONTEXT]</text>
    <text x="20" y="165" fill="#98c379" font-family="monospace" font-size="12"> Performance: [KEY_PARAMETERS]"</text>
    
    <text x="20" y="200" fill="#E67E22" font-family="monospace" font-size="12">// Output format:</text>
    <text x="20" y="220" fill="#abb2bf" font-family="monospace" font-size="12">- Primary function with standard</text>
    <text x="20" y="240" fill="#abb2bf" font-family="monospace" font-size="12">- Secondary functions</text>
    <text x="20" y="260" fill="#abb2bf" font-family="monospace" font-size="12">- Measurable criteria</text>
  </g>
  
  <!-- Title overlay -->
  <text x="400" y="380" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Copy-Paste Prompts for Reliability Engineers</text>
</svg>
