<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#2C3E50" font-family="Inter, sans-serif" font-size="24" font-weight="bold">AI-Assisted FMEA Process</text>
  
  <!-- FMEA Table representation -->
  <g transform="translate(50, 100)">
    <!-- Header row -->
    <rect x="0" y="0" width="700" height="40" fill="#0D6E6E"/>
    <text x="70" y="26" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Function</text>
    <text x="190" y="26" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Failure Mode</text>
    <text x="310" y="26" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Cause</text>
    <text x="430" y="26" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Effect</text>
    <text x="550" y="26" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Detection</text>
    <text x="650" y="26" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Task</text>
    
    <!-- Row 1 - Manual -->
    <rect x="0" y="40" width="140" height="50" fill="white" stroke="#ddd"/>
    <text x="70" y="70" text-anchor="middle" fill="#2C3E50" font-family="Inter, sans-serif" font-size="10">You define</text>
    
    <!-- Row 1 - AI assisted -->
    <rect x="140" y="40" width="120" height="50" fill="#E67E22" fill-opacity="0.2" stroke="#E67E22"/>
    <rect x="260" y="40" width="120" height="50" fill="#E67E22" fill-opacity="0.2" stroke="#E67E22"/>
    <rect x="380" y="40" width="100" height="50" fill="#E67E22" fill-opacity="0.2" stroke="#E67E22"/>
    <rect x="480" y="40" width="120" height="50" fill="#E67E22" fill-opacity="0.2" stroke="#E67E22"/>
    <rect x="600" y="40" width="100" height="50" fill="#E67E22" fill-opacity="0.2" stroke="#E67E22"/>
    
    <text x="200" y="70" text-anchor="middle" fill="#E67E22" font-family="Inter, sans-serif" font-size="10" font-weight="bold">AI suggests</text>
    <text x="320" y="70" text-anchor="middle" fill="#E67E22" font-family="Inter, sans-serif" font-size="10" font-weight="bold">AI suggests</text>
    <text x="430" y="70" text-anchor="middle" fill="#E67E22" font-family="Inter, sans-serif" font-size="10" font-weight="bold">AI suggests</text>
    <text x="540" y="70" text-anchor="middle" fill="#E67E22" font-family="Inter, sans-serif" font-size="10" font-weight="bold">AI suggests</text>
    <text x="650" y="70" text-anchor="middle" fill="#E67E22" font-family="Inter, sans-serif" font-size="10" font-weight="bold">AI suggests</text>
    
    <!-- Row 2 - Review -->
    <rect x="0" y="90" width="700" height="40" fill="#0D6E6E" fill-opacity="0.1"/>
    <text x="350" y="115" text-anchor="middle" fill="#0D6E6E" font-family="Inter, sans-serif" font-size="12" font-weight="bold">↓ Engineer reviews, validates, and refines all AI suggestions ↓</text>
    
    <!-- Final row -->
    <rect x="0" y="130" width="700" height="50" fill="white" stroke="#0D6E6E" stroke-width="2"/>
    <text x="350" y="160" text-anchor="middle" fill="#2C3E50" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Complete, validated FMEA row ready for implementation</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="20" height="20" fill="white" stroke="#ddd"/>
    <text x="30" y="15" fill="#2C3E50" font-family="Inter, sans-serif" font-size="12">Manual input by engineer</text>
    
    <rect x="250" y="0" width="20" height="20" fill="#E67E22" fill-opacity="0.2" stroke="#E67E22"/>
    <text x="280" y="15" fill="#2C3E50" font-family="Inter, sans-serif" font-size="12">AI-assisted (suggestions to review)</text>
    
    <rect x="500" y="0" width="20" height="20" fill="white" stroke="#0D6E6E" stroke-width="2"/>
    <text x="530" y="15" fill="#2C3E50" font-family="Inter, sans-serif" font-size="12">Validated output</text>
  </g>
  
  <!-- Time savings callout -->
  <g transform="translate(200, 380)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#0D6E6E"/>
    <text x="200" y="35" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="bold">Time Savings</text>
    <text x="200" y="60" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14">Traditional: 30-60 min per row → AI-Assisted: 5-10 min per row</text>
  </g>
</svg>
