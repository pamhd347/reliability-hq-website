<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#2C3E50"/>
  
  <!-- Warning triangle -->
  <g transform="translate(400, 50)">
    <path d="M0 -30 L180 250 L-180 250 Z" fill="none" stroke="#E67E22" stroke-width="4"/>
    <text x="0" y="150" text-anchor="middle" fill="#E67E22" font-family="Inter, sans-serif" font-size="120" font-weight="bold">!</text>
  </g>
  
  <!-- X marks for mistakes -->
  <g fill="#dc3545" opacity="0.3">
    <text x="100" y="120" font-family="Inter, sans-serif" font-size="60">✗</text>
    <text x="650" y="100" font-family="Inter, sans-serif" font-size="50">✗</text>
    <text x="80" y="300" font-family="Inter, sans-serif" font-size="45">✗</text>
    <text x="680" y="280" font-family="Inter, sans-serif" font-size="55">✗</text>
    <text x="150" y="200" font-family="Inter, sans-serif" font-size="35">✗</text>
    <text x="620" y="180" font-family="Inter, sans-serif" font-size="40">✗</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="360" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Common RCM Implementation Mistakes</text>
  <text x="400" y="385" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" opacity="0.7">And How to Avoid Them</text>
</svg>
