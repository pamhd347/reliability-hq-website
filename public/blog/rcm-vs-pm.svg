<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#2C3E50"/>
  
  <!-- Left side - PM -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="200" height="200" rx="20" fill="#6c757d" fill-opacity="0.3" stroke="#6c757d" stroke-width="2"/>
    <text x="100" y="50" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="bold">PM</text>
    <text x="100" y="80" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" opacity="0.7">Preventive</text>
    
    <!-- Calendar icon -->
    <rect x="60" y="100" width="80" height="70" rx="5" fill="white" fill-opacity="0.2"/>
    <line x1="60" y1="120" x2="140" y2="120" stroke="white" stroke-opacity="0.5"/>
    <text x="100" y="155" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="24">📅</text>
  </g>
  
  <!-- VS -->
  <text x="400" y="210" text-anchor="middle" fill="#E67E22" font-family="Inter, sans-serif" font-size="32" font-weight="bold">VS</text>
  
  <!-- Right side - RCM -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="200" height="200" rx="20" fill="#0D6E6E" fill-opacity="0.5" stroke="#0D6E6E" stroke-width="3"/>
    <text x="100" y="50" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="bold">RCM</text>
    <text x="100" y="80" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" opacity="0.7">Reliability Centred</text>
    
    <!-- Decision tree icon -->
    <circle cx="100" cy="120" r="15" fill="#E67E22"/>
    <line x1="100" y1="135" x2="70" y2="165" stroke="white" stroke-width="2"/>
    <line x1="100" y1="135" x2="130" y2="165" stroke="white" stroke-width="2"/>
    <circle cx="70" cy="175" r="10" fill="white" fill-opacity="0.5"/>
    <circle cx="130" cy="175" r="10" fill="white" fill-opacity="0.5"/>
  </g>
  
  <!-- Bottom comparison -->
  <text x="250" y="340" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" opacity="0.6">Time-based</text>
  <text x="550" y="340" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" opacity="0.6">Context-based</text>
  
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="bold">Which Approach is Right for You?</text>
</svg>
