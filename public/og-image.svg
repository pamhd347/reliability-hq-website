  <text x="80" y="560" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#0D6E6E">Reliability Made Practical</text>
  
  <!-- Decorative element -->
  <rect x="1000" y="80" width="120" height="8" fill="#E67E22"/>
  <rect x="1050" y="108" width="70" height="8" fill="#E67E22" opacity="0.6"/>
  <rect x="1080" y="136" width="40" height="8" fill="#E67E22" opacity="0.3"/>
