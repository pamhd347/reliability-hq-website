<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F8F9FA"/>
  
  <!-- Left accent bar -->
  <rect width="8" height="630" fill="#0D6E6E"/>
  
  <!-- Logo area -->
  <rect x="80" y="80" width="80" height="80" rx="16" fill="#0D6E6E"/>
  <text x="120" y="138" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">R</text>
  
  <!-- Company name -->
  <text x="180" y="125" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#2C3E50">Reliability</text>
  <text x="370" y="125" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#0D6E6E"> HQ</text>
  
  <!-- Main headline -->
  <text x="80" y="280" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#2C3E50">Free RCM Training</text>
  <text x="80" y="360" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#2C3E50">for Engineers</text>
  
  <!-- Subheadline -->
  <text x="80" y="440" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#6C757D">SAE JA1011 compliant • Interactive slides • Quizzes</text>
  
