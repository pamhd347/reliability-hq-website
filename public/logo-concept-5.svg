<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- Concept 5: Bold geometric "RHQ" monogram + full text -->
  
  <!-- Monogram box -->
  <rect x="4" y="8" width="34" height="34" rx="4" fill="#0D6E6E"/>
  
  <!-- R letterform (negative space) -->
  <path d="M11 14 L11 34 M11 14 L23 14 C27 14 29 17 29 20 C29 23 27 26 23 26 L11 26" 
        stroke="#F8F9FA" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="26" x2="29" y2="34" stroke="#F8F9FA" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Amber accent bar -->
  <rect x="32" y="8" width="6" height="34" rx="2" fill="#E67E22"/>
  
  <!-- Text -->
  <text x="50" y="33" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#2C3E50">
    Reliability
  </text>
  <text x="152" y="33" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0D6E6E">
    HQ
  </text>
</svg>
