<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- Concept 1: Gear with checkmark + text -->
  <defs>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D6E6E"/>
      <stop offset="100%" style="stop-color:#0a5a5a"/>
    </linearGradient>
  </defs>
  
  <!-- Gear icon with checkmark -->
  <g transform="translate(5, 5)">
    <!-- Outer gear teeth -->
    <path d="M20 2 L22 6 L26 6 L28 2 L32 4 L30 8 L33 11 L37 9 L38 13 L34 15 L34 19 L38 21 L37 25 L33 23 L30 26 L32 30 L28 32 L26 28 L22 28 L20 32 L16 30 L18 26 L15 23 L11 25 L10 21 L14 19 L14 15 L10 13 L11 9 L15 11 L18 8 L16 4 Z" 
          fill="url(#tealGradient)"/>
    <!-- Inner circle -->
    <circle cx="24" cy="17" r="8" fill="#F8F9FA"/>
    <!-- Checkmark -->
    <path d="M19 17 L22 20 L29 13" stroke="#0D6E6E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="52" y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#2C3E50">
    Reliability
  </text>
  <text x="145" y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0D6E6E">
    HQ
  </text>
</svg>
