<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F8F9FA"/>
  
  <!-- Spreadsheet mockup -->
  <g transform="translate(80, 60)">
    <!-- Shadow -->
    <rect x="12" y="12" width="620" height="480" rx="8" fill="#2C3E50" opacity="0.15"/>
    
    <!-- Main spreadsheet window -->
    <rect width="620" height="480" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect width="620" height="40" rx="8" fill="#0D6E6E"/>
    <rect y="32" width="620" height="8" fill="#0D6E6E"/>
    <circle cx="24" cy="20" r="6" fill="#EF4444"/>
    <circle cx="44" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="20" r="6" fill="#10B981"/>
    <text x="310" y="25" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">FMEA Worksheet Template</text>
    
    <!-- Column headers -->
    <rect x="0" y="40" width="620" height="35" fill="#0D6E6E" opacity="0.1"/>
    <line x1="80" y1="40" x2="80" y2="480" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="180" y1="40" x2="180" y2="480" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="300" y1="40" x2="300" y2="480" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="420" y1="40" x2="420" y2="480" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="520" y1="40" x2="520" y2="480" stroke="#E5E7EB" stroke-width="1"/>
    
    <text x="40" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50" text-anchor="middle">Item</text>
    <text x="130" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50" text-anchor="middle">Function</text>
    <text x="240" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50" text-anchor="middle">Failure Mode</text>
    <text x="360" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50" text-anchor="middle">Effect</text>
    <text x="470" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50" text-anchor="middle">Consequence</text>
    <text x="570" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50" text-anchor="middle">Task</text>
    
    <!-- Row lines -->
    <line x1="0" y1="75" x2="620" y2="75" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="110" x2="620" y2="110" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="145" x2="620" y2="145" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="180" x2="620" y2="180" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="215" x2="620" y2="215" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="0" y1="250" x2="620" y2="250" stroke="#E5E7EB" stroke-width="1"/>
    
    <!-- Sample data rows -->
    <rect x="2" y="76" width="616" height="34" fill="#0D6E6E" opacity="0.05"/>
    <rect x="2" y="146" width="616" height="34" fill="#0D6E6E" opacity="0.05"/>
    <rect x="2" y="216" width="616" height="34" fill="#0D6E6E" opacity="0.05"/>
    
    <!-- Cell content indicators (simplified) -->
    <rect x="10" y="85" width="60" height="8" rx="2" fill="#2C3E50" opacity="0.3"/>
    <rect x="90" y="85" width="80" height="8" rx="2" fill="#2C3E50" opacity="0.2"/>
    <rect x="190" y="85" width="100" height="8" rx="2" fill="#2C3E50" opacity="0.25"/>
    <rect x="310" y="85" width="100" height="8" rx="2" fill="#2C3E50" opacity="0.2"/>
    <rect x="430" y="85" width="80" height="8" rx="2" fill="#E67E22" opacity="0.5"/>
    <rect x="530" y="85" width="80" height="8" rx="2" fill="#0D6E6E" opacity="0.4"/>
    
    <rect x="10" y="120" width="50" height="8" rx="2" fill="#2C3E50" opacity="0.3"/>
    <rect x="90" y="120" width="70" height="8" rx="2" fill="#2C3E50" opacity="0.2"/>
    <rect x="190" y="120" width="90" height="8" rx="2" fill="#2C3E50" opacity="0.25"/>
    <rect x="310" y="120" width="90" height="8" rx="2" fill="#2C3E50" opacity="0.2"/>
    <rect x="430" y="120" width="70" height="8" rx="2" fill="#0D6E6E" opacity="0.4"/>
    <rect x="530" y="120" width="70" height="8" rx="2" fill="#0D6E6E" opacity="0.4"/>
  </g>
  
  <!-- "SAE JA1011" badge -->
  <g transform="translate(580, 450)">
    <rect width="140" height="36" rx="18" fill="#0D6E6E"/>
    <text x="70" y="23" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">SAE JA1011</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="720" cy="80" r="40" fill="#E67E22" opacity="0.15"/>
  <circle cx="60" cy="520" r="30" fill="#0D6E6E" opacity="0.1"/>
</svg>
